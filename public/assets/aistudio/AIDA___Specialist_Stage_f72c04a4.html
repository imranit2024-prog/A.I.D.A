<!DOCTYPE html>
<html lang="bn"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIDA – Specialist Stage</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#070916;--bg2:#140e30;--glass:rgba(255,255,255,.06);--glass2:rgba(255,255,255,.1);--line:rgba(255,255,255,.14);--text:#eef0ff;--mute:#a0a6ca;--accent:#22b8e8;--glow:color-mix(in srgb,var(--accent) 50%,transparent);--panelbg:rgba(14,12,36,.72);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e9ecfb;--bg2:#f6efff;--glass:rgba(255,255,255,.55);--glass2:rgba(255,255,255,.85);--line:rgba(60,60,120,.18);--text:#16183a;--mute:#5e6390;--panelbg:rgba(255,255,255,.8);color-scheme:light}}
:root[data-theme="light"]{--bg:#e9ecfb;--bg2:#f6efff;--glass:rgba(255,255,255,.55);--glass2:rgba(255,255,255,.85);--line:rgba(60,60,120,.18);--text:#16183a;--mute:#5e6390;--panelbg:rgba(255,255,255,.8);color-scheme:light}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;height:100%;overflow:hidden;color:var(--text);font:500 14px/1.6 "Manrope","Noto Sans Bengali",system-ui,sans-serif;background:linear-gradient(160deg,var(--bg),var(--bg2))}
button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.glow{position:fixed;inset:0;background:radial-gradient(60% 55% at 50% 62%,color-mix(in srgb,var(--accent) 30%,transparent),transparent 70%);transition:background .8s;pointer-events:none}
.g{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);box-shadow:0 10px 40px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.08)}
.top{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}
.logo{width:32px;height:32px;border-radius:11px;background:linear-gradient(135deg,var(--accent),#8b5cf6);display:grid;place-items:center;color:#fff;box-shadow:0 0 22px var(--glow);transition:.6s}
.ibtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:16px;transition:.2s}
.ibtn:hover,.ibtn[aria-pressed="true"]{box-shadow:0 0 22px var(--glow);border-color:var(--accent)}
.tr{display:flex;gap:10px}
.title{position:fixed;top:calc(env(safe-area-inset-top,0px) + 66px);left:0;right:0;text-align:center;z-index:5;pointer-events:none}
.title h1{margin:0;font-size:26px;font-weight:800;letter-spacing:.01em;text-shadow:0 0 30px var(--glow)}
.title p{margin:0;color:var(--mute);font-size:13px}
.slides{position:fixed;inset:0;overflow:hidden;touch-action:pan-y}
.platform{position:absolute;left:50%;bottom:17vh;width:min(70vw,520px);aspect-ratio:3.4/1;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 65%,transparent),transparent 72%)}
.platform::before,.platform::after{content:"";position:absolute;inset:12% 6%;border-radius:50%;border:2px solid var(--accent);box-shadow:0 0 28px var(--accent),inset 0 0 28px var(--glow);transition:.6s}
.platform::after{inset:30% 22%;opacity:.7}
.slide{position:absolute;left:50%;bottom:19vh;height:min(66vh,620px);aspect-ratio:2/3;transform:translateX(-50%);transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .6s,filter .6s;will-change:transform}
.slide svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 26px var(--glow))}
.slide.side{filter:blur(2px) saturate(.7)}
.nav{position:fixed;top:50%;transform:translateY(-50%);z-index:12}.nav.l{left:16px}.nav.r{right:16px}
.dots{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 118px);left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:10}
.dots button{border:1px solid var(--line);background:var(--glass);border-radius:99px;padding:3px 11px;font-size:11.5px;color:var(--mute);transition:.25s}
.dots button[aria-current="true"]{color:var(--text);border-color:var(--accent);box-shadow:0 0 16px var(--glow);background:var(--glass2)}
.dock{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:18px;z-index:20}
.state{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);left:0;right:0;text-align:center;color:var(--mute);font-size:12.5px;z-index:10;display:none}
.mic{width:76px;height:76px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--accent),#7c4dff);color:#fff;display:grid;place-items:center;box-shadow:0 0 34px var(--glow);position:relative;transition:.25s}
.mic:hover{transform:scale(1.05)}
.mic[aria-pressed="true"]{animation:ring 1.3s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 var(--accent),0 0 34px var(--glow)}100%{box-shadow:0 0 0 24px transparent,0 0 34px var(--glow)}}
.ov{position:fixed;left:50%;top:50%;transform:translate(-50%,-30%) scale(.96);width:min(340px,86vw);padding:18px 20px;border-radius:22px;z-index:25;opacity:0;pointer-events:none;transition:.5s;box-shadow:0 0 50px var(--glow)}
.ov.on{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
.ov h2{margin:0 0 2px;font-size:18px}.ov .r{color:var(--accent);font-weight:700;font-size:12.5px;margin-bottom:8px}
.ov ul{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:6px}.ov li{padding:7px 12px;border-radius:12px;background:var(--glass);border:1px solid var(--line);font-size:13px}
.panel{position:fixed;top:0;bottom:0;width:min(360px,92vw);z-index:30;display:flex;flex-direction:column;background:var(--panelbg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.panel.l{left:0;transform:translateX(-105%);border-radius:0 24px 24px 0}.panel.r{right:0;transform:translateX(105%);border-radius:24px 0 0 24px;width:min(420px,92vw)}
.panel.open{transform:none}
.ph{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);font-weight:800}
.ph .ibtn{width:34px;height:34px}
.list{flex:1;overflow:auto;padding:8px}.gl{padding:10px 10px 4px;color:var(--mute);font-size:12px;font-weight:600}
.item{display:flex;gap:9px;align-items:center;width:100%;padding:9px 10px;border:1px solid transparent;background:none;border-radius:12px;text-align:left}
.item:hover{background:var(--glass)}.item.on{background:var(--glass2);border-color:var(--line)}
.item .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
.newchat{margin:12px 14px 0;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--glass2);text-align:left}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;min-height:0}
.m{max-width:90%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere}
.m.u{align-self:flex-end;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 55%,#4c2bd6),#5b3df0);color:#fff;border-bottom-right-radius:6px}
.m.a{align-self:flex-start;background:var(--glass2);border:1px solid var(--line);border-bottom-left-radius:6px}
.who{font-size:11.5px;font-weight:700;color:var(--c);margin-bottom:2px}
.empty{margin:auto;color:var(--mute);text-align:center}
.composer{padding:12px 14px 14px;border-top:1px solid var(--line)}
.box{display:flex;gap:8px;align-items:flex-end;background:var(--glass2);border:1px solid var(--line);border-radius:20px;padding:8px}
.box:focus-within{border-color:var(--accent);box-shadow:0 0 24px var(--glow)}
textarea{flex:1;resize:none;border:0;background:none;color:var(--text);font:inherit;padding:8px 6px;max-height:110px;outline:none}
.send{width:40px;height:40px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--accent),#7c4dff);color:#fff;font-weight:700}.send:disabled{opacity:.35}
.set{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.97);width:min(420px,92vw);max-height:84vh;overflow:auto;border-radius:24px;padding:20px;z-index:40;opacity:0;pointer-events:none;transition:.35s;background:var(--panelbg)}
.set.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.set h3{margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row small{display:block;color:var(--mute)}
select,input[type=range]{background:var(--glass2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font:inherit}input[type=range]{padding:0;accent-color:var(--accent);width:120px}
.sw{width:46px;height:26px;border-radius:99px;border:1px solid var(--line);background:var(--glass2);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--mute);transition:.25s}
.sw[aria-checked="true"]{background:var(--accent)}.sw[aria-checked="true"]::after{left:22px;background:#fff}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 110px);left:50%;transform:translateX(-50%);padding:8px 16px;border-radius:99px;z-index:50;opacity:0;transition:.3s;pointer-events:none;font-size:13px}.toast.on{opacity:1}
.scrim{position:fixed;inset:0;z-index:28;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.3s}.scrim.on{opacity:1;pointer-events:auto}
@media (max-width:700px){.nav{display:none}.title h1{font-size:21px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style></head>
<body>
<div class="glow"></div>
<header class="top">
  <div class="brand"><div class="logo" id="logo">✦</div>AIDA</div>
  <div class="tr">
    <button class="ibtn g" id="bHist" aria-label="History" aria-pressed="false">☰</button>
    <button class="ibtn g" id="bInfo" aria-label="About this specialist">i</button>
    <button class="ibtn g" id="bSet" aria-label="Settings">⚙</button>
  </div>
</header>
<div class="title"><h1 id="tN"></h1><p id="tR"></p></div>
<div class="slides" id="slides"><div class="platform"></div></div>
<button class="ibtn g nav l" id="prev" aria-label="Previous specialist">‹</button>
<button class="ibtn g nav r" id="next" aria-label="Next specialist">›</button>
<div class="dots" id="dots"></div>
<div class="state" id="state"></div>
<div class="dock">
  <button class="ibtn g" id="bText" aria-label="Type a message" aria-pressed="false">⌨</button>
  <button class="mic" id="bMic" aria-pressed="false" aria-label="Speak"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  <button class="ibtn g" id="bVoice" aria-label="Toggle voice replies" aria-pressed="true">🔊</button>
</div>
<div class="ov g" id="ov"></div>
<div class="scrim" id="scrim"></div>
<aside class="panel g l" id="pHist"><div class="ph">History<button class="ibtn g" data-close>✕</button></div><button class="newchat" id="newChat">＋ New conversation</button><div class="list" id="list"></div></aside>
<aside class="panel g r" id="pChat"><div class="ph"><span id="cTitle">Conversation</span><button class="ibtn g" data-close>✕</button></div>
  <div class="msgs" id="msgs" aria-live="polite"></div>
  <div class="composer"><div class="box"><textarea id="inp" rows="1" placeholder="Message AIDA…"></textarea><button class="send" id="send" disabled aria-label="Send">↑</button></div></div></aside>
<section class="set g" id="set" role="dialog" aria-label="Settings"><h3>Settings <button class="ibtn g" data-close style="width:34px;height:34px">✕</button></h3>
  <div class="row"><div>Speech language<small>Voice input and replies</small></div><select id="sLang"><option value="bn-BD">বাংলা</option><option value="en-US">English</option></select></div>
  <div class="row"><div>Voice replies</div><button class="sw" id="sVoice" role="switch" aria-checked="true" aria-label="Voice replies"></button></div>
  <div class="row"><div>Speech speed</div><input type="range" id="sRate" min="0.7" max="1.4" step="0.05" value="1"></div>
  <div class="row"><div>Idle motion<small>How lively the avatar is</small></div><input type="range" id="sIdle" min="0" max="2" step="0.1" value="1"></div>
  <div class="row"><div>Glow effects</div><button class="sw" id="sGlow" role="switch" aria-checked="true" aria-label="Glow"></button></div>
  <div class="row"><div>Show panels on start</div><button class="sw" id="sPanels" role="switch" aria-checked="false" aria-label="Panels"></button></div>
  <div class="row"><div>Theme</div><select id="sTheme"><option value="auto">Auto</option><option value="dark">Dark</option><option value="light">Light</option></select></div>
</section>
<div class="toast g" id="toast"></div>
<script>
const SP=[
 {id:"nonstop",n:"Non-stop",role:"Expert on everything",c:"#22b8e8",skin:"#e8b48f",hair:"#1d1a22",style:0,outfit:"#1c2a44",x:"tie",skills:["Ask anything, any topic","Hands-free, always listening","Switches you to the right expert"],intro:"Ami Non-stop. Je kono bishoy-e kotha bolte paro."},
 {id:"exec",n:"Executive",role:"Planning & priorities",c:"#f5b42a",skin:"#d9a07c",hair:"#4a2a1c",style:1,outfit:"#2a2a33",x:"vest",skills:["Plan your day and week","Prioritise tasks","Draft decisions and summaries"],intro:"Ami Executive. Planning ar priority niye kaj kori."},
 {id:"coder",n:"Coder",role:"Write, debug, review",c:"#34d399",skin:"#e9bd97",hair:"#15151c",style:2,outfit:"#1d2740",x:"glasses",skills:["Write and explain code","Debug errors","Review and test"],intro:"Ami Coder. Code likhte ar bug dhorte pari."},
 {id:"arch",n:"Architect",role:"System design & APIs",c:"#a78bfa",skin:"#f0c9ab",hair:"#6b4a35",style:3,outfit:"#1b1b26",x:"blazer",skills:["Design system structure","Plan data and APIs","Infrastructure choices"],intro:"Ami Architect. System design-er bepare sahajyo kori."},
 {id:"sec",n:"Security",role:"Defense & networking",c:"#fb6f6f",skin:"#e2b08a",hair:"#2a1c1c",style:0,outfit:"#8a97b3",x:"tee",skills:["Harden accounts and devices","Network basics","Spot common risks"],intro:"Ami Security. Defence ar networking niye kotha bolbo."},
 {id:"res",n:"Researcher",role:"Evidence & analysis",c:"#60a5fa",skin:"#f1cdb0",hair:"#1b1612",style:2,outfit:"#27406b",x:"round",skills:["Investigate questions","Compare sources","Weigh the evidence"],intro:"Ami Researcher. Proman dekhe uttor khuji."},
 {id:"write",n:"Writer",role:"Bengali & English text",c:"#f472b6",skin:"#eebd9c",hair:"#1f7a5c",style:4,outfit:"#245a5e",x:"round",skills:["Draft and edit text","Bengali and English","Tone and style polish"],intro:"Ami Writer. Bangla ar English lekhay sahajyo kori."}];
const $=id=>document.getElementById(id),esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const cfg={lang:"bn-BD",voice:true,rate:1,idle:1,glow:true,panels:false};
let cur=0,state="idle",sess=[],ses=null,rec=null,mouth=0,target=0,blink=0,nextBlink=2,tState=0,spkEnd=0;
try{sess=JSON.parse(localStorage.getItem("aida.st")||"[]")}catch(e){}
function avatar(p){const h=p.hair,k=p.skin,o=p.outfit;
 const hairBack=p.style===3||p.style===4?`<path d="M52 100c-10 50 0 90 8 100h80c8-10 18-50 8-100z" fill="${h}"/>`:"";
 const hairTop=[`<path d="M56 100c-4-48 28-66 46-66s52 14 42 66c-8-26-26-34-44-34s-36 8-44 34z" fill="${h}"/>`,`<path d="M56 98c-6-46 30-62 48-58 24-2 46 16 40 58-10-22-30-26-46-26-16 0-32 4-42 26z" fill="${h}"/>`,`<path d="M54 100c-8-50 24-70 48-68 28 0 52 20 44 68-6-30-24-40-46-40s-38 10-46 40z" fill="${h}"/>`,`<path d="M54 104c-6-52 28-72 48-72s54 18 44 72c-6-34-28-46-46-46s-40 12-46 46z" fill="${h}"/>`,`<path d="M54 102c-4-50 24-70 50-68 26 2 48 20 42 68-8-30-30-36-48-34-18 2-36 8-44 34z" fill="${h}"/>`][p.style];
 let ex="";
 if(p.x==="glasses")ex=`<g fill="none" stroke="#111" stroke-width="3"><rect x="68" y="98" width="28" height="22" rx="7"/><rect x="104" y="98" width="28" height="22" rx="7"/><path d="M96 108h8"/></g>`;
 if(p.x==="round")ex=`<g fill="none" stroke="#111" stroke-width="3"><circle cx="82" cy="109" r="13"/><circle cx="118" cy="109" r="13"/><path d="M95 108h10"/></g>`;
 let wear=`<path d="M30 300c0-52 22-92 70-92s70 40 70 92z" fill="${o}"/>`;
 if(p.x==="tie")wear+=`<path d="M84 208l16 20 16-20 6 18-14 4 8 66h-32l8-66-14-4z" fill="#fff"/><path d="M96 226h8l5 60h-18z" fill="#111"/>`;
 if(p.x==="vest")wear+=`<path d="M70 208l30 40 30-40v92H70z" fill="#fff" opacity=".9"/><path d="M100 248l-18 52h36z" fill="#111" opacity=".6"/>`;
 if(p.x==="blazer")wear+=`<path d="M84 208l16 36 16-36 22 12-20 80H82l-20-80z" fill="#eaeaf5" opacity=".9"/>`;
 if(p.x==="tee")wear+=`<path d="M82 208q18 18 36 0" fill="none" stroke="rgba(0,0,0,.25)" stroke-width="3"/>`;
 return `<svg viewBox="0 0 200 300" aria-hidden="true">${hairBack}<g class="body">${wear}<rect x="86" y="170" width="28" height="44" rx="12" fill="${k}"/><g class="head"><ellipse cx="100" cy="112" rx="42" ry="50" fill="${k}"/>${hairTop}
 <g class="brows" stroke="${h}" stroke-width="3.5" stroke-linecap="round"><path d="M70 94q12-6 24 0"/><path d="M106 94q12-6 24 0"/></g>
 <g class="eyes"><g class="eye" style="transform-origin:82px 108px"><ellipse cx="82" cy="108" rx="7" ry="5.5" fill="#fff"/><circle class="pu" cx="82" cy="108" r="3.4" fill="#1a1a22"/></g><g class="eye" style="transform-origin:118px 108px"><ellipse cx="118" cy="108" rx="7" ry="5.5" fill="#fff"/><circle class="pu" cx="118" cy="108" r="3.4" fill="#1a1a22"/></g></g>${ex}
 <path d="M100 112q-4 14 2 18" fill="none" stroke="rgba(0,0,0,.22)" stroke-width="2.5" stroke-linecap="round"/>
 <ellipse class="mo" cx="100" cy="143" rx="11" ry="2" fill="#5a1f2a"/></g></g></svg>`}
const sl=$("slides");SP.forEach((p,i)=>{const d=document.createElement("div");d.className="slide";d.innerHTML=avatar(p);sl.appendChild(d);p.el=d;p.head=d.querySelector(".head");p.body=d.querySelector(".body");p.eyes=[...d.querySelectorAll(".eye")];p.pu=[...d.querySelectorAll(".pu")];p.mo=d.querySelector(".mo");p.brows=d.querySelector(".brows");p.ph=Math.random()*9});
$("dots").innerHTML=SP.map((p,i)=>`<button data-i="${i}">${p.n}</button>`).join("");
function layout(){const w=Math.min(innerWidth,1200);SP.forEach((p,i)=>{let o=i-cur;if(o>3)o-=7;if(o<-3)o+=7;const a=Math.abs(o);
 p.el.style.transform=`translateX(calc(-50% + ${o*Math.min(innerWidth*.34,380)}px)) scale(${a?0.62:1})`;p.el.style.opacity=a===0?1:a===1?.35:0;p.el.style.pointerEvents=a===0?"auto":"none";p.el.classList.toggle("side",a>0);p.el.style.zIndex=10-a});
 document.querySelectorAll("#dots button").forEach((b,i)=>b.setAttribute("aria-current",i===cur))}
function showOv(){const p=SP[cur];$("ov").innerHTML=`<h2>${p.n}</h2><div class="r">${p.role}</div><div>${p.intro}</div><ul>${p.skills.map(s=>`<li>${s}</li>`).join("")}</ul>`;$("ov").classList.add("on");clearTimeout(showOv.t);showOv.t=setTimeout(()=>$("ov").classList.remove("on"),3800)}
function go(i,quiet){cur=(i+SP.length)%SP.length;const p=SP[cur];document.documentElement.style.setProperty("--accent",p.c);$("tN").textContent=p.n;$("tR").textContent=p.role;$("logo").textContent="✦";
 if(window.speechSynthesis)speechSynthesis.cancel();setState("idle");layout();if(!quiet)showOv()}
$("prev").onclick=()=>go(cur-1);$("next").onclick=()=>go(cur+1);$("dots").onclick=e=>{const b=e.target.closest("button");if(b)go(+b.dataset.i)};
$("bInfo").onclick=showOv;$("ov").onclick=()=>$("ov").classList.remove("on");
addEventListener("keydown",e=>{if(/TEXTAREA|SELECT|INPUT/.test(e.target.tagName))return;if(e.key==="ArrowLeft")go(cur-1);if(e.key==="ArrowRight")go(cur+1);if(e.key==="Escape")closeAll()});
let sx=null;sl.addEventListener("pointerdown",e=>sx=e.clientX);addEventListener("pointerup",e=>{if(sx!==null&&Math.abs(e.clientX-sx)>60&&e.target.closest("#slides"))go(cur+(e.clientX<sx?1:-1));sx=null});
function setState(s){state=s;tState=performance.now()/1000;const t={idle:"",listening:"Listening…",thinking:"Thinking…",speaking:"Speaking…"}[s];$("state").style.display=t?"block":"none";$("state").textContent=t;$("bMic").setAttribute("aria-pressed",s==="listening")}
/* animation loop: breathing, sway, blink, gaze, lip-sync */
function frame(ms){const t=ms/1000,I=cfg.idle,st=state,k=Math.min(1,(t-tState)*3);
 if(t>nextBlink){blink=1;nextBlink=t+2.5+Math.random()*3.5}blink=Math.max(0,blink-.12);
 const bl=blink>0?1-Math.sin((1-blink)*Math.PI)*.92:1;
 SP.forEach((p,i)=>{const a=Math.abs(i-cur)===0,q=a?1:.5,u=t+p.ph;
  const br=Math.sin(u*1.7)*1.6*I,sway=(Math.sin(u*.55)*2.2+Math.sin(u*.23)*1.5)*I*q;
  let hr=sway,hy=br*.6,hx=Math.sin(u*.4)*2*I*q,bs=Math.sin(u*.8)*1.2*I;
  if(a){if(st==="listening"){hr=-5+sway*.3;hy+=3;}else if(st==="thinking"){hr=4;hy-=2;hx+=4}else if(st==="speaking"){hr+=Math.sin(u*2.3)*2.2;hy+=Math.sin(u*4.1)*1.2}}
  p.body.setAttribute("transform",`translate(${bs} ${br})`);p.head.setAttribute("transform",`translate(${hx} ${hy}) rotate(${hr} 100 170)`);
  p.eyes.forEach(e=>e.style.transform=`scaleY(${a?bl:1})`);
  const gx=a?(st==="thinking"?-2.5:Math.sin(u*.6)*1.4*I):0;p.pu.forEach(e=>e.setAttribute("transform",`translate(${gx} ${st==="thinking"&&a?-2:0})`));
  p.brows.setAttribute("transform",`translate(0 ${a&&st==="speaking"?-1.5+Math.sin(u*3)*1:0})`);
  if(a){const open=(st==="speaking")?mouth:0;p.mo.setAttribute("ry",2+open*11);p.mo.setAttribute("rx",11-open*3)}});
 if(state==="speaking"){const syl=Math.abs(Math.sin(t*9.5)*Math.sin(t*3.1+1))*(.55+.45*Math.sin(t*1.3));target=.15+syl*.85;if(!speechSynthesis.speaking&&t>spkEnd){setState("idle")}}else target=0;
 mouth+=(target-mouth)*.35;requestAnimationFrame(frame)}
requestAnimationFrame(frame);
/* panels */
function closeAll(){["pHist","pChat","set"].forEach(i=>$(i).classList.remove("open"));$("scrim").classList.remove("on");$("bHist").setAttribute("aria-pressed",false);$("bText").setAttribute("aria-pressed",false)}
function openP(id,btn){const o=$(id).classList.contains("open");closeAll();if(!o){$(id).classList.add("open");$("scrim").classList.add("on");if(btn)$(btn).setAttribute("aria-pressed",true);if(id==="pChat")setTimeout(()=>$("inp").focus(),300)}}
$("bHist").onclick=()=>openP("pHist","bHist");$("bText").onclick=()=>openP("pChat","bText");$("bSet").onclick=()=>openP("set");
$("scrim").onclick=closeAll;document.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeAll);
function toast(t){$("toast").textContent=t;$("toast").classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>$("toast").classList.remove("on"),2200)}
/* chat */
const save=()=>{try{localStorage.setItem("aida.st",JSON.stringify(sess))}catch(e){}};
const day=t=>{const d=(Date.now()-t)/864e5;return d<1?"Today":d<2?"Yesterday":"Earlier"};
function newS(){ses={id:Date.now(),title:"New conversation",msgs:[],t:Date.now(),sp:cur};sess.unshift(ses);render()}
function render(){let l="",h="";sess.forEach(s=>{const g=day(s.t);if(g!==l){h+=`<div class="gl">${g}</div>`;l=g}const c=SP[s.sp||0].c;h+=`<button class="item ${ses&&s.id===ses.id?"on":""}" data-id="${s.id}"><span class="dot" style="background:${c};color:${c}"></span><span class="t">${esc(s.title)}</span></button>`});
 $("list").innerHTML=h||'<div class="gl">No conversations yet</div>';$("cTitle").textContent=ses.title;
 $("msgs").innerHTML=ses.msgs.length?ses.msgs.map(m=>m.r==="u"?`<div class="m u">${esc(m.t)}</div>`:`<div class="m a" style="--c:${m.c}"><div class="who">${m.n}</div>${esc(m.t)}</div>`).join(""):'<div class="empty">Say hello to '+SP[cur].n+'.<br>Tap the mic or type here.</div>';$("msgs").scrollTop=1e9}
$("list").onclick=e=>{const b=e.target.closest(".item");if(b){ses=sess.find(s=>s.id==b.dataset.id);go(ses.sp||0,true);render();openP("pChat","bText")}};
$("newChat").onclick=()=>{newS();openP("pChat","bText")};
function speak(t){const done=()=>{spkEnd=0};setState("speaking");spkEnd=performance.now()/1000+Math.max(2.2,t.length*.06);
 if(cfg.voice&&window.speechSynthesis){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=/[\u0980-\u09FF]/.test(t)?"bn-BD":"en-US";u.rate=cfg.rate;u.onend=u.onerror=()=>{spkEnd=0};speechSynthesis.speak(u)}catch(e){}}}
function send(txt){txt=txt.trim();if(!txt)return;if(!ses)newS();const p=SP[cur];if(!ses.msgs.length){ses.title=txt.slice(0,34);ses.sp=cur}
 ses.msgs.push({r:"u",t:txt});ses.t=Date.now();setState("thinking");render();
 setTimeout(()=>{const r=`${p.n} here. Demo reply — connect your backend in send() for real answers.`;ses.msgs.push({r:"a",t:r,c:p.c,n:"AIDA · "+p.n});save();render();speak(r)},1100)}
const inp=$("inp");inp.oninput=()=>{$("send").disabled=!inp.value.trim();inp.style.height="auto";inp.style.height=inp.scrollHeight+"px"};
inp.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();go2()}};function go2(){const v=inp.value;inp.value="";inp.oninput();send(v)}$("send").onclick=go2;
/* voice input (toggle) */
$("bMic").onclick=()=>{if(state==="listening"){if(rec)try{rec.stop()}catch(e){}clearTimeout($("bMic").t);return setState("idle")}
 if(window.speechSynthesis)speechSynthesis.cancel();const SR=window.SpeechRecognition||window.webkitSpeechRecognition;setState("listening");
 if(!SR){toast("Voice input needs Chrome/Edge — demo only");$("bMic").t=setTimeout(()=>{if(state==="listening")send("(voice demo) Hello")},2500);return}
 try{rec=new SR();rec.lang=cfg.lang;let got=false;rec.onresult=e=>{got=true;send(e.results[0][0].transcript)};rec.onend=()=>{if(!got&&state==="listening")setState("idle")};rec.onerror=()=>{if(state==="listening")setState("idle")};rec.start()}catch(e){setState("idle")}};
/* voice-reply toggle + settings */
function applyV(){$("bVoice").setAttribute("aria-pressed",cfg.voice);$("bVoice").textContent=cfg.voice?"🔊":"🔇";$("sVoice").setAttribute("aria-checked",cfg.voice);if(!cfg.voice&&window.speechSynthesis)speechSynthesis.cancel()}
$("bVoice").onclick=()=>{cfg.voice=!cfg.voice;applyV()};$("sVoice").onclick=()=>{cfg.voice=!cfg.voice;applyV()};
$("sLang").onchange=e=>cfg.lang=e.target.value;$("sRate").oninput=e=>cfg.rate=+e.target.value;$("sIdle").oninput=e=>cfg.idle=+e.target.value;
$("sGlow").onclick=e=>{cfg.glow=!cfg.glow;e.currentTarget.setAttribute("aria-checked",cfg.glow);document.querySelector(".glow").style.opacity=cfg.glow?1:0;document.querySelector(".slides").style.setProperty("--x",0);document.querySelectorAll(".slide svg").forEach(s=>s.style.filter=cfg.glow?"":"none")};
$("sPanels").onclick=e=>{cfg.panels=!cfg.panels;e.currentTarget.setAttribute("aria-checked",cfg.panels)};
$("sTheme").onchange=e=>{const v=e.target.value;if(v==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.dataset.theme=v};
addEventListener("resize",layout);
sess.length?ses=sess[0]:newS();go(0);render();
</script></body></html>
